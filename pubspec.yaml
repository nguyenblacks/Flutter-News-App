name: flutter_news_app
description: Flutter News App with NewsApi
version: 2.0.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.4.3+1
  flutter_bloc: ^8.1.6
  intl: ^0.19.0
  url_launcher: ^6.3.0
  cached_network_image: ^3.3.1
  get_it: ^7.7.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  internet_connection_checker_plus: ^2.5.2
  flutter_screenutil: ^5.9.3
  device_info_plus: ^10.1.2
  flutter_svg: ^2.0.10+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.9
  mockito: ^5.4.4
  bloc_test: ^9.1.7
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/
