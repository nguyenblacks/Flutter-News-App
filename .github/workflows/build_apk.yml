name: Build Flutter APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
      JAVA_OPTS: "-Xmx4096m"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code analysis
        run: flutter analyze

      - name: Build Release APK (Production)
        run: flutter build apk --release --flavor production -t lib/main_production.dart --android-skip-build-dependency-validation

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: swavoti-news-production-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

